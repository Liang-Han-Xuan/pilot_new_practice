
<!DOCTYPE html>

/* 預備拍圓點：無底色無邊框 */
#prep-row{
  background:none;border:none;
  display:flex;gap:12px;justify-content:center;align-items:center;
  min-height:26px;visibility:hidden;
  /* 往上移 44px：讓預備拍圓點到樂譜的距離跟先備／測驗階段一樣（那兩頁的倒數數字放在樂譜框裡，樂譜因此多往下 44px） */
  position:absolute;top:-40px;left:50%;transform:translateX(-50%);
  pointer-events:none;
}
.pdot{width:11px;height:11px;border-radius:50%;background:#ddd;transition:background .06s;}
.pdot.active{background:#4caf50;}

.controls{display:flex;gap:10px;align-items:center;margin-top:7px}
.btn{border:none;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s;outline:none}
.btn:active{transform:scale(0.95)}
.btn-next{background:#f0a030;color:white}
.btn-retry{background:#4a7cc9;color:white}
.btn-lbl{font-size:9px;opacity:.75;margin-top:1px}

  visibility:hidden;

#play-answer-btn:hover:not(:disabled){background:#3a6ab8;}
#play-answer-btn:disabled{background:#9e9e9e;cursor:not-allowed;box-shadow:none;}
#my-recording-btn{
  visibility:hidden;
  border:none;background:#4caf50;color:#fff;
  border-radius:7px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 6px rgba(76,175,80,0.4);

/* 兩個音檔（我的錄音／正確答案）都聽完一次後，才會出現在樂譜右上角的黃色箭頭提示，

/* 準備時間倒數：進入這一題（樂譜顯示）後強制從20秒開始倒數，倒數期間不能提前按空白鍵開始，
   時間到會自動開始（等同自動按下空白鍵）。 */
/* 準備時間倒數：進入這一題（樂譜顯示）後強制從20秒開始倒數，倒數期間不能提前按空白鍵開始，
   時間到會自動開始（等同自動按下空白鍵）。放在樂譜正上方（.score-wrap 外面、當作它的前一個
   兄弟元素），用一般文件流置中對齊，不疊在樂譜或箭頭上面。 */
#prep-countdown{
  display:none;

/* 防觸控干擾：禁止兩指滑動換頁/回彈；作答畫面禁止選取文字；預備拍＋錄製期間禁止觸控螢幕的捲動與縮放 */

<body>

<!-- 倒數數字＋提示語：外框高度維持跟原本只有倒數數字時一樣，提示語用絕對定位疊在外框底部、倒數數字往上移，樂譜與節拍器(預備拍圓點)的位置完全不受影響 -->

    <!-- 預備拍下方的作答提示：放在 #prep-row 裡、用絕對定位，跟預備拍圓點一起顯示/隱藏，不佔版面、不影響樂譜位置 -->

  </div>
  <div id="score-actions">
    <div id="metacog-prompt" style="display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e53935;color:#fff;font-size:18px;font-weight:700;text-align:center;padding:10px 16px;border-radius:8px;max-width:400px;">注意各個回饋是偏快還是偏慢？</div>
    <div id="playback-btns">
      <button id="my-recording-btn" onclick="playMyRecording()">我的錄音</button>

<div id="finish-msg" style="display:none;color:#000;font-weight:700;font-size:20px;text-align:center;margin-bottom:10px;">練習結束，靜待研究人員指示</div>

<div id="csv-download-row" style="display:none;margin-top:10px;text-align:center;">
  <button id="csv-download-btn" onclick="downloadSessionCSV()" style="background:none;border:1.5px solid #6b4fa0;color:#6b4fa0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;">下載本機備份 CSV</button>
  <button id="tapdetail-download-btn" onclick="downloadTapDetailCSV()" style="background:none;border:1.5px solid #6b4fa0;color:#6b4fa0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-left:8px;">下載拍點明細 CSV</button>
  <button id="overall-download-btn" onclick="downloadOverallCSV()" style="background:none;border:1.5px solid #6b4fa0;color:#6b4fa0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-left:8px;">下載整體資料 CSV</button>
</div>
</div>
<script>
const COLOR_GREEN=60,COLOR_YELLOW=150;
/* 預設題組：練習階段6題.json 的內容，本頁固定使用這個題組出題。 */
const DEFAULT_QUESTION_SET={
  "name":"練習階段6題",
  "questions":[
    { "bars": ["4 0 88 4", "88 4 88 08", "0 88 08 4", "08 4 4 88"] },
    { "bars": ["88 4 08 88", "08 88 4 4", "4 88 88 0", "0 4 08 88"] },
    { "bars": ["0 88 08 4", "4 0 88 4", "08 4 4 88", "88 4 88 08"] },
    { "bars": ["4 4 88 0", "88 08 88 4", "0 88 4 08", "08 4 0 88"] },
    { "bars": ["88 08 4 88", "08 0 4 88", "4 88 0 4", "0 88 08 88"] },
    { "bars": ["08 0 4 88", "0 88 08 88", "88 08 4 88", "4 88 0 4"] }
  ]
};
const AC=window.AudioContext||window.webkitAudioContext;
let ac,metroNodes=[],recDest=null,mediaRec=null,recChunks=[],lastRecordingBlob=null,lastRecordingURL=null;
function getAC(){if(!ac){ac=new AC();recDest=ac.createMediaStreamDestination();}return ac;}
// 確保 AudioContext 真的已經開始運作（state==='running'）才 resolve。
// 剛建立或剛從 suspended 喚醒的 AudioContext，音訊硬體通常需要一小段暖機時間才會真的發出聲音，
// 但這段延遲不會反映在 a.currentTime 上；若沒等它跑穩就直接用 currentTime 排程聲音與畫面，
// 聲音會比用系統時鐘（setTimeout）排程的畫面（例如預備拍綠點）晚一點點，造成對不齊。
function ensureRunning(){const a=getAC();return a.state==='suspended'?a.resume():Promise.resolve();}
function beep(freq,t,vol,track=true){const a=getAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.connect(recDest);o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);o.start(t);o.stop(t+0.09);if(track)metroNodes.push(o);return o;}
function clap(t){const a=getAC(),len=Math.floor(a.sampleRate*0.13);const buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);const src=a.createBufferSource();src.buffer=buf;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=0.6;const g=a.createGain();g.gain.setValueAtTime(0.65,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.11);src.connect(bp);bp.connect(g);g.connect(a.destination);g.connect(recDest);src.start(t);src.stop(t+0.13);return src;}
function startRecording(){
  getAC();
  if(!recDest)return;
  recChunks=[];
  const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':
                  MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/ogg';
  try{mediaRec=new MediaRecorder(recDest.stream,{mimeType});}catch(e){mediaRec=new MediaRecorder(recDest.stream);}
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data);};
  mediaRec.onstop=()=>{
    if(lastRecordingURL)URL.revokeObjectURL(lastRecordingURL);
    const mime=mediaRec.mimeType||'audio/webm';
    lastRecordingBlob=new Blob(recChunks,{type:mime});
    lastRecordingURL=URL.createObjectURL(lastRecordingBlob);
    if(phase==='done')showMyRecordingBtn(true); // 重新開始時也會停止錄音，那時不要讓「我的錄音」按鈕跑出來
  };
  mediaRec.start(100);
}
function stopRecording(){
  if(mediaRec&&mediaRec.state!=='inactive'){mediaRec.stop();}
}
function stopMetro(){metroNodes.forEach(o=>{try{o.stop(getAC().currentTime);}catch(e){}});metroNodes=[];}

// 每拍三種可能：四分音符、四分休止符、兩個八分音符

/* ---- 自訂題目：每個小節用 4 個空白分隔的拍子代碼描述 ----
   4  = 四分音符
   0  = 四分休止符
   88 = 兩個八分音符
   08 = 一個八分休止符 + 一個八分音符
   檔案格式（JSON）：
   { "name": "題組名稱", "questions": [ { "bars": ["88 4 0 4", "4 88 4 0"] }, ... ] }
   每題的 bars 陣列，一個字串代表一個小節，各小節可以有不同數量。 */
function parseBarCode(code){
  const tokens=String(code).trim().split(/\s+/);
  if(tokens.length!==4)throw new Error('每個小節需要剛好 4 個拍子代碼（4 / 0 / 88 / 08），但收到「'+code+'」（'+tokens.length+' 個代碼）');
  const notes=[];
  tokens.forEach((tok,beat)=>{
    const t=tok.trim();
    if(t==='4')notes.push({b:beat,d:1,r:0});
    else if(t==='0')notes.push({b:beat,d:1,r:1});
    else if(t==='88'){notes.push({b:beat,d:0.5,r:0});notes.push({b:beat+0.5,d:0.5,r:0});}
    else if(t==='08'){notes.push({b:beat,d:0.5,r:1});notes.push({b:beat+0.5,d:0.5,r:0});}
    else throw new Error('無法辨識的拍子代碼「'+tok+'」（只接受 4 / 0 / 88 / 08）');
  });
  return notes;
}
function parseCustomFile(data){
  if(!data||!Array.isArray(data.questions)||data.questions.length===0)throw new Error('檔案需要有 "questions" 陣列，且至少一題');
  return data.questions.map((q,qi)=>{
    if(!q||!Array.isArray(q.bars)||q.bars.length===0)throw new Error('第 '+(qi+1)+' 題缺少 "bars" 陣列，或是空的');
    return q.bars.map(parseBarCode);
  });
}

let BARS=2,BPM=65,BEAT=60/BPM,curBars=[],totalBeats=8;
function buildSeq(){
  // 完全按照預設題組出題；即使索引意外超出範圍，也是夾在最後一題
  const idx=Math.min(questionCount,customQuestions.length-1);
  curBars=customQuestions[idx];
  BARS=curBars.length;
  totalBeats=BARS*4;
}
function globalSeq(){const s=[];curBars.forEach((bar,bi)=>bar.forEach(n=>s.push({b:n.b+bi*4,d:n.d,r:n.r})));return s;}

function buildRanges(seq,beat){return seq.map((e,i)=>{const idealT=e.b*beat,prev=seq[i-1],prevB=prev?prev.b:e.b-1,next=seq[i+1];const L=(prevB*beat+idealT)/2;const R=next?(idealT+next.b*beat)/2:idealT+e.d*beat;return{...e,idx:i,idealT,L,R};});} // L/R 現在只給 eventX() 畫回饋點定位用，不再拿來做 Hit/Miss/FA 的判定
/* Hit / Miss / FA 判定邏輯：依序掃過每一個實際拍點，同時用一個「錨點」(anchor) 追蹤
   「最後一次成功配對(Hit)的那個時間點」（一開始虛擬錨點在樂曲開頭 0ms）。對每一個拍點：
     實際間距(actualGap)＝這一拍的時間－錨點的實際時間
     理論間距(expectedGap)＝現在正在等待被打到的那個音符的理論時間(idealT)－錨點對應的理論時間
       （如果前面已經連續判定過幾個 Miss，這裡就是好幾個音符的 IOI 累加起來，不是只看單一一個 IOI）
     diff＝actualGap－expectedGap（正值代表拍點比預期晚，負值代表比預期早）
   用固定「半個八分音符」(=1/4拍) 當容許誤差緩衝，不隨音符長短變動：
     diff 超過 +緩衝 → 拍點還沒到，判定現在這個音符 Miss，音符往下一個推進，這一拍留著繼續跟
                      下一個（甚至下下個）音符比對，錨點不變
     diff 超過 -緩衝（也就是小於 -緩衝）→ 拍點來得太早，判定這一拍是多打(FA)，這一拍處理完畢跳
                      下一個拍點，音符不動，錨點不變
     diff 落在緩衝範圍內 → 判定 Hit，音符跟拍點都往下一個推進，錨點更新成這一拍的實際時間，
                      h.iti/h.ioi 直接記錄這裡算出來的 actualGap/expectedGap（已經考慮過中間
                      任何 Miss 的累加，不需要再另外做一層「可靠一對一對應」的篩選）
   這樣不管前面有沒有 Miss 或多打，只要「這一拍」跟「它前面最後一次真正配對成功的那個點」之間
   的實際間距，跟理論上應該累積的間距夠接近，就會被判定成可靠的 Hit。
   注意：上面這個 diff（判定用）只負責決定「這一拍算不算 Hit」，不是最後存進 h.diff、拿去做
   顏色分級／拍點明細 Error-AE／MAE 的那個誤差。一旦確定是 Hit，另外算一個 ownDiff＝這一拍的
   實際時間－它自己配對到的那個音符的絕對理論時間(idealT)，往後顏色分級／Error／Absolute
   Error／MAE 全部都用這個 ownDiff（絕對值＝AE），不是判定用的錨點相對誤差。 */
const MISS_FA_BUFFER_BEATS=0.25; // 緩衝值＝1/4拍（半個八分音符）
function matchAll(seq,hits,beat){
  const evts=buildRanges(seq,beat),notes=evts.filter(e=>!e.r),rests=evts.filter(e=>e.r);
  const buffer=beat*MISS_FA_BUFFER_BEATS;
  const nws=notes.map(n=>({...n,done:false,result:null,diff:null,abs:null,barIdx:Math.floor(n.b/4)}));
  const hs=hits.map(h=>({t:h,done:false,result:null,ni:-1,diff:null,color:null,ord:0,iti:null,ioi:null}));
  let ni=0,anchorActual=0,anchorIdealT=0;
  for(let i=0;i<hs.length;i++){
    const h=hs[i];
    while(true){
      if(ni>=nws.length){h.done=true;h.result='FA';h.color='#e24b4a';h.afterEnd=true;break;} // 音符已經全部配對完，剩下的拍點都算多打（發生在樂譜結束之後，供回饋圖 4.5 定位規則使用）
      const w=nws[ni];
      const actualGap=h.t-anchorActual,expectedGap=w.idealT-anchorIdealT;
      // matchDiff：只用來判斷 Hit/Miss/FA 的門檻（跟「上一次成功配對」的錨點比），不是最後存起來的 Error/AE
      const matchDiff=Math.round((actualGap-expectedGap)*1000);
      if(matchDiff>buffer*1000){w.done=true;w.result='Miss';w.imgIoi=Math.round(expectedGap*1000);ni++;continue;} // 拍點還沒到：這個音符判Miss，繼續跟下一個音符比對同一拍；imgIoi 只給回饋圖用，是「上一次成功配對音符」到這個 Miss 音符的累加理想間距
      if(matchDiff<-buffer*1000){h.done=true;h.result='FA';h.color='#e24b4a';h.afterEnd=false;break;} // 拍點來太早：判多打，音符不動（發生在樂譜結束之前，還有音符可比對）
      // 一旦確定是 Hit，Error/AE（顏色分級、拍點明細、MAE 都用這個）改成跟「自己實際配對到的音符」
      // 本身的絕對理論時間(idealT)比較，而不是跟判定用的錨點相對誤差比較。
      const ownDiff=Math.round((h.t-w.idealT)*1000),ownAbs=Math.abs(ownDiff);
      const col=ownAbs<COLOR_GREEN?'#4caf50':(ownAbs<COLOR_YELLOW?'#f0a030':'#e24b4a');
      h.done=true;h.ni=ni;h.diff=ownDiff;h.result='Hit';h.color=col;
      h.iti=Math.round(actualGap*1000);h.ioi=Math.round(expectedGap*1000);
      w.done=true;w.result='Hit';w.diff=ownDiff;w.abs=ownAbs;
      anchorActual=h.t;anchorIdealT=w.idealT;
      ni++;
      break;
    }
  }
  while(ni<nws.length){nws[ni].done=true;nws[ni].result='Miss';nws[ni].imgIoi=Math.round((nws[ni].idealT-anchorIdealT)*1000);ni++;} // 拍點用完了，剩下沒配對到的音符全部是Miss（同樣補上 imgIoi 給回饋圖用）
  // ord 只用來決定回饋點畫在畫面上該貼近哪一個 evts（音符或休止符），純視覺定位，完全不影響上面的判定結果
  hs.forEach(h=>{
    if(h.result==='Hit'){h.ord=nws[h.ni].idx;return;}
    const rm=rests.find(rr=>h.t>=rr.L&&h.t<rr.R);
    if(rm){h.ord=rm.idx;return;}
    const nm=notes.find(w=>h.t>=w.L&&h.t<w.R);
    if(nm){h.ord=nm.idx;return;}
    h.ord=h.t<evts[0].L?-1:evts.length;
  });
  return{nws,hs,evts};
}

  const tt1=E('text',{x:NL-16,y:LY-3,fill:FBIMG.C_LINE,'font-size':'13','font-weight':'bold','font-family':'serif','text-anchor':'middle'});tt1.textContent='4';svg.appendChild(tt1);

  // 樂譜本體（音符／休止符／連桁／符尾），跟 renderScore() 同一套畫法，只是換成這裡的版面常數
  curBars.forEach((bar,bi)=>{
    const sl=NL+bi*FBIMG.SW_,il=sl+FBIMG.IP,iw=FBIMG.SW_-FBIMG.IP*2;
    function nx(b){const bw=iw/4;return il+b*bw+bw/2;}
    let i=0;
    while(i<bar.length){
      const n=bar[i],cx=nx(n.b);
      if(n.d===1&&!n.r){svg.appendChild(E('ellipse',{cx,cy:LY,rx:'7',ry:'5',fill:FBIMG.C_LINE,transform:`rotate(-15,${cx},${LY})`}));svg.appendChild(E('line',{x1:cx+6,y1:LY-2,x2:cx+6,y2:ST,stroke:FBIMG.C_LINE,'stroke-width':'1.8','stroke-linecap':'round'}));i++;}
      else if(n.d===1&&n.r){const t=E('text',{x:cx,y:LY,'font-family':'"NotoMusic",serif','font-size':'38',fill:FBIMG.C_LINE,'text-anchor':'middle','dominant-baseline':'middle'});t.textContent='\uD834\uDD3D';svg.appendChild(t);i++;}
      else if(n.d===0.5&&n.r){const t=E('text',{x:cx,y:LY+8,'font-family':'"NotoMusic",serif','font-size':'38',fill:FBIMG.C_LINE,'text-anchor':'middle','dominant-baseline':'middle'});t.textContent='\uD834\uDD3E';svg.appendChild(t);i++;}
      else if(n.d===0.5&&!n.r){
        const beatOf=Math.floor(n.b);let j=i+1;while(j<bar.length&&bar[j].d===0.5&&!bar[j].r&&Math.floor(bar[j].b)===beatOf)j++;
        const grp=bar.slice(i,j),sxs=[];
        grp.forEach(gn=>{const gcx=nx(gn.b),sx=gcx+6;svg.appendChild(E('ellipse',{cx:gcx,cy:LY,rx:'7',ry:'5',fill:FBIMG.C_LINE,transform:`rotate(-15,${gcx},${LY})`}));svg.appendChild(E('line',{x1:sx,y1:LY-2,x2:sx,y2:ST,stroke:FBIMG.C_LINE,'stroke-width':'1.8','stroke-linecap':'round'}));sxs.push(sx);});
        if(grp.length===1){svg.appendChild(E('path',{d:`M${sxs[0]},${ST} C${sxs[0]+14},${ST+8} ${sxs[0]+12},${ST+18} ${sxs[0]+4},${ST+22}`,fill:'none',stroke:FBIMG.C_LINE,'stroke-width':'2','stroke-linecap':'round'}));}
        else{svg.appendChild(E('line',{x1:sxs[0],y1:ST,x2:sxs[sxs.length-1],y2:ST,stroke:FBIMG.C_LINE,'stroke-width':'5','stroke-linecap':'butt'}));}
        i=j;
      }else i++;
    }
  });
  line(NL,LY,NR,LY,'1.8');
  line(NL,LY-22,NL,LY+22,'1.5');
  for(let b=1;b<BARS;b++){const bx=NL+b*FBIMG.SW_;line(bx,LY-22,bx,LY+22,'1.2');}
  line(NR+2,LY-22,NR+2,LY+22,'1.5');
  line(NR+8,LY-22,NR+8,LY+22,'5');
  // 最左側標籤：IOI、ITI、RTE%三列（4.4 配色：IOI/ITI 藍色、RTE% 紅色）
  fbText(NL-16,FBIMG.Y_IOI,FBIMG.C_IOI_ITI,'IOI');
  fbText(NL-16,FBIMG.Y_ITI,FBIMG.C_IOI_ITI,'ITI');
  fbText(NL-16,FBIMG.Y_RTE,FBIMG.C_RTE,'RTE%');
  // 回饋色點＋三列數字：TP顯示IOI/ITI/RTE%三個都有；FP只顯示ITI；FN只顯示IOI（4.3表格邏輯）
  events.forEach(e=>{
    if(e.hasDot)svg.appendChild(E('circle',{cx:e.x,cy:FBIMG.DOT_Y,r:'5.5',fill:e.color}));
    if(e.hasDot&&Math.abs(e.placedX-e.x)>1)svg.appendChild(E('line',{x1:e.x,y1:FBIMG.DOT_Y,x2:e.placedX,y2:FBIMG.Y_IOI,stroke:FBIMG.C_GAPLINE,'stroke-width':'1'}));
    if(e.type==='TP'){
      fbText(e.placedX,FBIMG.Y_IOI,FBIMG.C_IOI_ITI,String(e.ioi));
      fbText(e.placedX,FBIMG.Y_ITI,FBIMG.C_IOI_ITI,String(e.iti));
      if(e.rte!==null)fbText(e.placedX,FBIMG.Y_RTE,FBIMG.C_RTE,e.rte+'%');
    }else if(e.type==='FP'){
      fbText(e.placedX,FBIMG.Y_ITI,FBIMG.C_IOI_ITI,String(e.iti));
    }else if(e.type==='FN'&&e.ioi!==null){
      fbText(e.placedX,FBIMG.Y_IOI,FBIMG.C_IOI_ITI,String(e.ioi));
    }
  });
  // ------- 迴歸分析圖：x軸＝第幾個成功配對的TP點，y軸＝該次的RTE%（有正負號） -------
  const trendPts=collectTrendPoints(r),reg=computeTrendRegression(trendPts);
  const dom=computeTrendYDomain(trendPts,reg);
  const plotLeft=FB_CHART.MARGIN_LEFT,plotRight=W-FB_CHART.MARGIN_RIGHT,plotW=Math.max(plotRight-plotLeft,1);
  const plotTop=chartTop+FB_CHART.MARGIN_TOP,plotBottom=plotTop+FB_CHART.PLOT_H;
  const nPts=trendPts.length,xDomainMax=Math.max(nPts,1);
  function chartX(idx){return nPts>1?plotLeft+(idx-1)/(nPts-1)*plotW:plotLeft+plotW/2;}
  function chartY(val){return plotBottom-(val-dom.lo)/(dom.hi-dom.lo)*FB_CHART.PLOT_H;}
  // 標題：有迴歸線（≥2點）才顯示 β/β0，否則標記樣本數不足；資料點本身不管有沒有迴歸線都照畫
  const titleText=reg?`迴歸分析：β=${reg.beta.toFixed(2)}%（β0=${reg.beta0.toFixed(2)}%）`:'迴歸分析：樣本數不足';
  const titleEl=E('text',{x:W/2,y:chartTop+16,fill:FB_CHART.C_TITLE,'font-family':'sans-serif','font-size':'12','font-weight':'700','text-anchor':'middle'});
  titleEl.textContent=titleText;svg.appendChild(titleEl);
  // 座標軸（左邊Y軸、下面X軸）
  svg.appendChild(E('line',{x1:plotLeft,y1:plotTop,x2:plotLeft,y2:plotBottom,stroke:FB_CHART.C_AXIS,'stroke-width':'1'}));
  svg.appendChild(E('line',{x1:plotLeft,y1:plotBottom,x2:plotRight,y2:plotBottom,stroke:FB_CHART.C_AXIS,'stroke-width':'1'}));
  // Y軸單位標籤
  const yUnitLbl=E('text',{x:plotLeft,y:plotTop-10,fill:FB_CHART.C_AXIS,'font-family':'sans-serif','font-size':'9','font-weight':'700','text-anchor':'start'});
  yUnitLbl.textContent='RTE(%)';svg.appendChild(yUnitLbl);
  // Y軸刻度：固定 -20~20，切4格（-20、-10、0、10、20），整數顯示
  const Y_TICKS=4;
  for(let i=0;i<=Y_TICKS;i++){
    const val=dom.lo+(dom.hi-dom.lo)*i/Y_TICKS,ty=chartY(val);
    svg.appendChild(E('line',{x1:plotLeft-4,y1:ty,x2:plotLeft,y2:ty,stroke:FB_CHART.C_AXIS,'stroke-width':'1'}));
    const lbl=E('text',{x:plotLeft-8,y:ty+3,fill:FB_CHART.C_AXIS,'font-family':'sans-serif','font-size':'8','text-anchor':'end'});
    lbl.textContent=val.toFixed(0);svg.appendChild(lbl);
  }
  // X軸刻度：每一個TP點編號都給一個刻度（1,2,3...）
  for(let i=1;i<=xDomainMax;i++){
    const tx=chartX(i);
    svg.appendChild(E('line',{x1:tx,y1:plotBottom,x2:tx,y2:plotBottom+4,stroke:FB_CHART.C_AXIS,'stroke-width':'1'}));
    const lbl=E('text',{x:tx,y:plotBottom+15,fill:FB_CHART.C_AXIS,'font-family':'sans-serif','font-size':'8','text-anchor':'middle'});
    lbl.textContent=String(i);svg.appendChild(lbl);
  }
  const xLbl=E('text',{x:(plotLeft+plotRight)/2,y:plotBottom+28,fill:FB_CHART.C_AXIS,'font-family':'sans-serif','font-size':'9','font-weight':'700','text-anchor':'middle'});
  xLbl.textContent='第幾個成功配對的TP點';svg.appendChild(xLbl);
  // 裁切區：迴歸線與資料點只畫在繪圖區內（超出 ±20% 的部分會被切掉，不會蓋到上方樂譜或下方X軸文字）
  const clipId='trendClip'+(++trendClipSeq);
  const defs=E('defs',{}),cp=E('clipPath',{id:clipId});
  cp.appendChild(E('rect',{x:plotLeft-4,y:plotTop,width:plotW+8,height:FB_CHART.PLOT_H}));
  defs.appendChild(cp);svg.appendChild(defs);
  const plotG=E('g',{'clip-path':`url(#${clipId})`});
  // 灰色虛線：y=0 參考線（RTE%＝0代表完全準時）
  svg.appendChild(E('line',{x1:plotLeft,y1:chartY(0),x2:plotRight,y2:chartY(0),stroke:FB_CHART.C_REF,'stroke-width':'1','stroke-dasharray':'4,3'}));
  // 橘色虛線：β 迴歸線 β0+β×x（樣本數不足時不畫）
  if(reg){
    plotG.appendChild(E('line',{x1:chartX(1),y1:chartY(reg.beta0+reg.beta*1),x2:chartX(xDomainMax),y2:chartY(reg.beta0+reg.beta*xDomainMax),stroke:FB_CHART.C_REG,'stroke-width':'1.5','stroke-dasharray':'6,4'}));
  }
  // 藍色折線＋圓點：實際資料（trendPts 依 x 已經是遞增順序，直接連線即可）
  if(nPts>0){
    const d=trendPts.map((p,i)=>`${i===0?'M':'L'}${chartX(p.x)},${chartY(p.y)}`).join(' ');
    plotG.appendChild(E('path',{d,fill:'none',stroke:FB_CHART.C_DATA,'stroke-width':'1.5'}));
    trendPts.forEach(p=>plotG.appendChild(E('circle',{cx:chartX(p.x),cy:chartY(p.y),r:'3',fill:FB_CHART.C_DATA})));
  }
  svg.appendChild(plotG);
  return{svg,W,H};
}
/* SVG → PNG（5.5~5.9）：序列化成字串、包成 Blob 餵給 Image，載入完成後畫到放大2倍的
   離屏 canvas 上再輸出 PNG Blob。任何一步失敗（例如斷網抓不到 NotoMusic 字型、瀏覽器
   不支援），退回直接回傳 SVG 本身的 Blob，確保至少有資料留存，不會整個失敗變成沒有圖片。 */
function feedbackGraphToBlob(r,callback){
  let built;
  try{built=buildFeedbackGraphSVG(r);}catch(err){console.error('產生回饋圖失敗：',err);callback(null);return;}
  const{svg,W,H}=built;
  const svgStr=new XMLSerializer().serializeToString(svg);
  const svgBlob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const svgUrl=URL.createObjectURL(svgBlob);
  const img=new Image();
  img.onload=()=>{
    try{
      const scale=2;
      const canvas=document.createElement('canvas');
      canvas.width=W*scale;canvas.height=H*scale;
      const ctx=canvas.getContext('2d');
      ctx.scale(scale,scale);
      ctx.drawImage(img,0,0,W,H);
      URL.revokeObjectURL(svgUrl);
      canvas.toBlob(blob=>callback(blob||svgBlob),'image/png');
    }catch(err){console.error('回饋圖轉PNG失敗，改用SVG原始碼留存：',err);callback(svgBlob);}
  };
  img.onerror=()=>{console.error('回饋圖SVG載入失敗（可能斷網抓不到字型），改用SVG原始碼留存：');callback(svgBlob);};
  img.src=svgUrl;
}
/* 自動上傳到雲端：每一題錄音結束、畫面（音符＋回饋＋IOI/ITI/比值/RTE）都畫好之後，
   不需要受試者或研究人員按任何按鈕，就直接把這張畫面轉成 PNG、再轉成 base64 字串，
   用跟 uploadToGoogleSheet() 一樣的方式 POST 給同一個 Google Apps Script 網址。
   注意：這裡只負責「把圖片送到你的雲端試算表網址」，真正把圖片存進 Google Drive
   的動作要靠 Apps Script 那邊的程式碼來處理（doPost 收到 data.imageUpload 之後，
   要自己解碼 base64 並用 DriveApp.createFile(...) 存檔）——這一段是外部、你們研究室
   自己架設維護的 Google 帳號底下的程式，我這邊沒辦法直接幫你改到那個雲端上的程式碼，
   需要請研究人員／工程窗口在 Apps Script 專案裡加上對應的處理，可以參考我在回覆裡附的
   Apps Script 範例片段。如果 Apps Script 還沒加上這段處理，這裡送出去的圖片資料
   目前就不會真的被存下來，但不會影響其他資料（F-score、MAE、拍點明細等）的上傳。 */
function autoUploadScoreImage(qNum){
  if(!GOOGLE_SHEET_WEBHOOK_URL)return; // 沒設定雲端試算表網址就不嘗試上傳
  if(!lastMatchResult)return; // 這一題還沒有任何判定結果可以畫成回饋圖
  feedbackGraphToBlob(lastMatchResult,blob=>{
    if(!blob){console.error('自動上傳畫面失敗：無法產生圖片');return;}
    const reader=new FileReader();
    reader.onload=()=>{
      fetch(GOOGLE_SHEET_WEBHOOK_URL,{
        method:'POST',
        mode:'no-cors', // 跟 uploadToGoogleSheet() 一樣：讀不到伺服器實際回應，但資料仍會送達
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({imageUpload:{group:groupId,subject:subjectId,question:qNum,imageBase64:reader.result}})
      }).catch(err=>console.error('自動上傳畫面到雲端失敗：',err));
    };
    reader.readAsDataURL(blob);
  });
}
/* 依目前「我的錄音／正確答案」是否已聽過，重新決定兩顆按鈕的鎖定狀態。
   規則：每個音檔每題只能聽一次，順序固定為 我的錄音 → 正確答案。
   我的錄音聽完 → 我的錄音鎖住、正確答案解鎖；正確答案聽完 → 兩顆都鎖住，不能再重聽。 */
function syncPlaybackButtons(){
  if(audioBusy)return;
  const myBtn=document.getElementById('my-recording-btn');
  const ansBtn=document.getElementById('play-answer-btn');
  myBtn.disabled=myRecFirstDone;
  ansBtn.disabled=!myRecFirstDone||answerFirstDone;
}
/* 「下一題／點此結束練習」按鈕的鎖定狀態：播放音檔期間、或「我的錄音」「正確答案」
   還沒各聽過一次時，都維持鎖定樣式（灰色、不能按），避免受試者提早跳題。 */
function refreshNextBtnLock(){
  const bothDone=myRecFirstDone&&answerFirstDone;
  const locked=audioBusy||!bothDone;
  nextLocked=locked;
  document.getElementById('next-arrow').style.display=bothDone?'block':'none'; // 兩個音檔（我的錄音／正確答案）都聽完第一次後才出現
}

function startTest(){
  const input=document.getElementById('subject-id-input');
  const id=input.value.trim();
  if(!id){alert('請輸入受試者編號');input.focus();return;}
  const groupSelect=document.getElementById('group-select');
  const group=groupSelect.value;
  if(!group){alert('請選擇組別');groupSelect.focus();return;}
  subjectId=id;
  groupId=group;
  // 回饋條件由組別決定（原本在設定面板的 G1/G2/G3 開關）：G1＝即時回饋、G2＝同步摘要回饋、G3＝摘要回饋
  const GROUP_TO_SW={G1:'live',G2:'syncsummary',G3:'summary'};
  Object.keys(SW).forEach(k=>SW[k]=(k===GROUP_TO_SW[group]));
  document.getElementById('subject-entry').style.display='none';
  document.getElementById('test-area').style.display='flex';
  markQuestionShown(); // 第一題的樂譜在此刻才真正顯示給受試者看，從這裡開始強制倒數20秒準備時間
  ensureRunning(); // 提早（趁這個真人手勢）建立並喚醒 AudioContext，讓它在受試者按空白鍵前就先暖機完成，
                    // 避免第一題的預備拍聲音因為 AudioContext 剛啟動而落後於綠點畫面
}

/* 空白鍵專用：只負責「開始這一題」跟「錄音中的拍點」；進到下一題只能按右方向鍵（見下面 keydown 監聽器的 ArrowRight 分支）。 */
function handleSpaceKey(){
  if(audioBusy)return;
  if(phase==='idle'){if(prepCountdownTimer)return;start();} // 強制準備：20秒倒數還在跑時，空白鍵不能提早開始，時間到才自動開始
  else if(phase==='recording'||(phase==='preparing'&&ac&&ac.currentTime>=taskStartTime-BEAT/2)){onHit();}
}

/* 用 capture 階段掛在 document 上，確保無論當下鍵盤焦點停在哪個按鈕/滑桿上，
   空白鍵、右方向鍵一定會被接收到，不會被個別元素的監聽器攔截而遺漏拍點。
   注意：handleSpaceKey() 必須是這個事件處理函式裡「第一個」被呼叫的動作，
   中間不要插入 blur() 之類的額外操作，否則某些瀏覽器可能不再把後續
   建立/恢復 AudioContext 的動作視為直接源自使用者手勢，導致完全沒聲音。 */
document.addEventListener('keydown',function(e){
  if(subjectId===''||document.getElementById('test-area').style.display==='none')return; // 尚未輸入受試者編號開始測驗前，不接受空白鍵/右方向鍵
  if(e.code==='Space'){
    e.preventDefault();e.stopPropagation();
    handleSpaceKey(); // 只負責開始這一題／錄音中的拍點，不會進到下一題
    if(ac&&ac.state!=='running'){ac.resume().catch(()=>{});console.warn('[除錯] 按空白鍵時 AudioContext 不是 running（',ac.state,'），已嘗試喚醒');} // 保險：音訊被系統暫停時(例如切換耳機/喇叭、螢幕休眠)，趁這個真人按鍵把它喚醒
  } else if(e.code==='ArrowRight'){
    e.preventDefault();e.stopPropagation();
    if(audioBusy)return; // 播放音檔期間不允許切換下一題
    if(nextReady&&!nextLocked)newQuestion();
  }
},true);

/* === 防觸控干擾 ===
   1) 預備拍＋作答錄製期間(phase=preparing/recording)：整個頁面的滑鼠/觸控板/觸控螢幕輸入(含捲動)全部攔截，
      誤觸不會點到任何東西、不會捲動、不會讓按鍵焦點跑掉；鍵盤(空白鍵)完全不受影響。
      其他時間不攔截，研究者仍可按左上角的 ↺ 讓這一題重新開始。
   2) 作答畫面顯示期間：一律擋掉右鍵選單、Ctrl＋滾輪/捏合縮放、選取文字。
   3) 作答畫面顯示期間若要離開/重新整理/觸控板兩指滑動回上一頁，瀏覽器會先跳出確認，避免資料遺失。
   4) 錄製期間視窗失去焦點(例如誤觸到工作列或其他視窗)時，畫面上方顯示紅色警告。 */
function inTestScreen(){return document.getElementById('test-area').style.display==='flex';}
function pointerLocked(){return inTestScreen()&&(phase==='preparing'||phase==='recording');}
['pointerdown','pointerup','mousedown','mouseup','click','dblclick','auxclick','touchstart','touchmove','touchend','wheel','dragstart']
  .forEach(type=>window.addEventListener(type,e=>{
    if(!pointerLocked())return;
    if(e.target&&e.target.closest&&e.target.closest('#restart-btn'))return; // ↺ 例外：預備拍／錄製中也能按，其他地方照樣鎖住
    e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
  },{capture:true,passive:false}));
['contextmenu','selectstart','gesturestart','gesturechange']
  .forEach(type=>window.addEventListener(type,e=>{
    if(inTestScreen()){e.preventDefault();e.stopPropagation();}
  },{capture:true,passive:false}));
window.addEventListener('wheel',e=>{if(inTestScreen()&&e.ctrlKey)e.preventDefault();},{capture:true,passive:false}); // 觸控板捏合縮放
window.addEventListener('beforeunload',e=>{if(inTestScreen()){e.preventDefault();e.returnValue='';}});
window.addEventListener('blur',()=>{
  if(pointerLocked()){document.getElementById('focus-warning').style.display='block';console.warn('[除錯] 作答期間視窗失去焦點，phase=',phase);}
});
window.addEventListener('focus',()=>{document.getElementById('focus-warning').style.display='none';});
setInterval(()=>{ // 依目前狀態切換 CSS（選取文字、觸控螢幕捲動/縮放）
  const root=document.documentElement;
  root.classList.toggle('in-test',inTestScreen());
  root.classList.toggle('input-locked',pointerLocked());
},100);

/* 「本題重新開始」用：attemptId 每次開始作答/重新開始都會遞增，讓還沒跑完的舊非同步流程自動作廢；
   prepNodes/prepFlashTmrs 記錄預備拍的聲音與綠點計時器，重新開始時一併停掉，避免舊的預備拍繼續響。 */
let attemptId=0,prepNodes=[],prepFlashTmrs=[];
function stopPrepAudio(){
  prepNodes.forEach(o=>{try{o.stop(getAC().currentTime);}catch(e){}});prepNodes=[];
  prepFlashTmrs.forEach(id=>clearTimeout(id));prepFlashTmrs=[];
}

function start(){
  if(phase==='preparing'||phase==='recording')return;
  clearPrepCountdown();showPrepCountdown(false); // 不管是倒數自動觸發還是防禦性呼叫，開始這一題就把準備倒數收掉
  userHits=[];lastMatchResult=null;clearFb();
  showAnswerBtn(false);showMyRecordingBtn(false);
  const myAttempt=++attemptId;
  phase='preparing';
  showPrepRow(true);flashDot(-1);
  startRecording();
  recordedBeat=BEAT;recordedTotalBeats=totalBeats; // 記住這一題實際錄製當下的設定，供「我的錄音」重播使用
  taskStartTime=Infinity; // 等 AudioContext 暖機的這段空檔，先設成無限大，避免沿用上一題殘留的 taskStartTime 誤觸發 onHit
  // 等 AudioContext 確認真的 running 之後，才把「現在」當作排程聲音與畫面共同的時間基準，
  // 避免剛啟動/剛喚醒時那段音訊暖機延遲，害聲音跟綠點對不齊。
  ensureRunning().then(()=>{
    if(phase!=='preparing'||myAttempt!==attemptId)return; // 等待期間使用者若已經取消/重來，就不要再排程
    const a=getAC(),now=a.currentTime+0.05;
    for(let i=0;i<4;i++){prepNodes.push(beep(i===0?880:660,now+i*BEAT,i===0?0.3:0.2,false));prepFlashTmrs.push(setTimeout(()=>flashDot(i),Math.max(0,(now+i*BEAT-a.currentTime)*1000)));}
    const taskStart=now+4*BEAT;taskStartTime=taskStart;
    // 作答（recording）階段不排程節拍器 click，只保留前面 4 拍的預備拍；
    // 節拍器聲音只在播放音檔（正確答案／我的錄音，見 playAnswer/playMyRecording）時才留著。
    prepTmr=setTimeout(()=>{
      phase='recording';
      showPrepRow(false);flashDot(-1);
      if(endTmr)clearTimeout(endTmr);
      endTmr=setTimeout(endRec,totalBeats*BEAT*1000); // 最後一個音符的判定窗右界現在就是 totalBeats*BEAT（見 buildRanges），這裡不用再多留緩衝時間，音符演奏完這一題就結束
    },Math.max(0,(taskStart-a.currentTime)*1000));
  });
}

function onHit(){
  const a=getAC(),t=a.currentTime-taskStartTime;
  if(t<-BEAT/2)return; // 允許在第一拍前最多半拍的搶拍，讓它進入正常判定（可能被判太早、但不會被直接丟掉變 MISS）
  userHits.push(t);
  clap(a.currentTime);
  if(!SW.live)return;
  const r=matchAll(globalSeq(),userHits,BEAT);
  lastMatchResult=r;
  drawHit(r.hs[r.hs.length-1],r);
}

function endRec(){
  phase='done';
  const r=matchAll(globalSeq(),userHits,BEAT);lastMatchResult=r;
  clearFb();if(SW.summary||SW.syncsummary)drawAll(r); // G1 的 Miss 空心圓是錄音當下即時畫出來的（見 onHit()），這裡清空後不再重畫
  showAnswerBtn(true);
  // 回饋圖不再於這裡上傳：改到 newQuestion()（按右方向鍵／點下一題）時才上傳，這一題若被「重新開始」就不會留下圖片
  myRecFirstDone=false;answerFirstDone=false;
  myRecExtraClicks=0;answerExtraClicks=0;
  reviewStartTime=Date.now(); // 從任務結束這一刻開始計「回顧時間」，直到受試者按下下一題
  showMetacog(SW.summary||SW.syncsummary); // G1 的提示語在這裡消失；G2/G3 的提示語在這裡出現，直到按下一題
  setTimeout(()=>stopRecording(),600); // 延遲一點讓最後音效都錄進去
  nextReady=true;
  refreshNextBtnLock();
}

function logTapDetails(r,qNum){
  // 分類只有三種（拿掉 TP_X，所有 Hit 一律算 TP）：
  //   TP：matchAll() 判定成功的 Hit（h.iti/h.ioi 是判定當下直接算出來的，如果前面連續判過幾個
  //       Miss，這裡的 IOI 就是好幾個音符的 IOI 累加起來，不是單一一個音符的 IOI；h.diff 是這一拍
  //       自己實際跟預期時間點的誤差，用來算 Error / Absolute Error）
  //   FA：matchAll() 判定這一拍是多打，沒有配對到音符，沒有 Error 可算
  //   FN：matchAll() 判定這個音符是 Miss，IOI 一樣由樂譜算出來，但沒有實際拍擊可以對照
  // RTE(%) 是有正負號的（(ITI-IOI)/IOI×100，正代表偏慢、負代表偏快）；ARTE(%) 是它的絕對值。
  const ioiSeq=computeIOISeq();
  r.hs.forEach((h,i)=>{
    if(h.result==='Hit'){
      const rte=h.ioi?Number(((h.iti-h.ioi)/h.ioi*100).toFixed(1)):'';
      const arte=h.ioi?Number((Math.abs(h.iti-h.ioi)/h.ioi*100).toFixed(1)):'';
      tapDetailLog.push({q:qNum,idx:i+1,error:h.diff,absError:Math.abs(h.diff),cat:'TP',ioi:h.ioi,iti:h.iti,rte,arte});
    }else{
      // 多打沒有 matchAll() 判定用的 iti，這裡顯示最單純的「跟上一個 raw tap 的實際時間差」（第一拍用0ms當虛擬起點）
      const rawIti=i>0?Math.round((h.t-r.hs[i-1].t)*1000):Math.round(h.t*1000);
      tapDetailLog.push({q:qNum,idx:i+1,error:'',absError:'',cat:'FP',ioi:'',iti:rawIti,rte:'',arte:''});
    }
  });
  r.nws.forEach((w,i)=>{
    if(w.result==='Miss'){
      // Miss 沒有實際拍擊，「拍點序號」留空；IOI 一樣由樂譜的 target event 序列算出來（跟 Hit 與否無關）。
      tapDetailLog.push({q:qNum,idx:'',error:'',absError:'',cat:'FN',ioi:ioiSeq[i].ioi,iti:'',rte:'',arte:''});
    }
  });
}

function downloadTapDetailCSV(){
  if(tapDetailLog.length===0){alert('目前還沒有任何拍點紀錄可以下載。');return;}
  const header=TAP_DETAIL_HEADER.join(',');
  const rows=tapDetailLog.map(d=>[groupId,subjectId,d.q,d.idx,d.cat,d.error,d.absError,d.rte,d.arte].join(','));
  const filename='tapdetail_'+(groupId||'G')+'_'+(subjectId||'data')+'.csv';
  const blob=new Blob(['\uFEFF'+header+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const blobUrl=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=blobUrl;link.download=filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);
}

/* 這一題 TP/FA/FN 各自的總數，寫進「練習階段資料庫」摘要表（不再有 TP_X 這個分類，
   所有 matchAll() 判定成功的 Hit 一律算 TP）：
   TP：matchAll() 判定為 Hit 的拍點數
   FA：matchAll() 判定為多打的拍點數
   FN：matchAll() 判定為 Miss 的音符數 */
function countTPFPFN(r){
  let tp=0,fa=0;
  r.hs.forEach(h=>{
    if(h.result==='Hit')tp++;
    else fa++;
  });
  const fn=r.nws.filter(w=>w.result==='Miss').length;
  return{tp,fa,fn};
}
/* F-score 直接用 TP、FA、FN 這三個數字算（不再需要 TP+TP_X 合併，因為 TP_X 已經不存在）：
   Precision = TP/(TP+FA)，Recall = TP/(TP+FN)，F = 2PR/(P+R)，分母為0時該項當作0。 */
function computeFScore(counts){
  const tp=counts.tp;
  const P=(tp+counts.fa)>0?tp/(tp+counts.fa):0;
  const R=(tp+counts.fn)>0?tp/(tp+counts.fn):0;
  return(P+R)>0?2*P*R/(P+R):0;
}
/* MAE：這一題所有 TP（matchAll() 判定為 Hit 的拍點）自己的 |Error|（h.diff，判定當下算出來的
   時間誤差）取平均，單位 ms。一個 TP 都沒有（例如整題都 Miss/多打）就回傳 null。 */
function computeMAE(r){
  // AE 跟拍點明細表「AE」欄寫進去的值完全相同（Math.abs(h.diff)），MAE＝這些 AE 的算術平均數
  const aes=r.hs.filter(h=>h.result==='Hit').map(h=>Math.abs(h.diff));
  if(aes.length===0)return null;
  return aes.reduce((a,b)=>a+b,0)/aes.length;
}
function exportCSV(){
  if(!lastMatchResult)return;
  questionCount++;
  logTapDetails(lastMatchResult,questionCount);
  const reviewMs=reviewStartTime!==null?Date.now()-reviewStartTime:'';
  const rteVal=computeOverallRTE(lastMatchResult);
  const betaReg=computeRegressionBeta(lastMatchResult); // {beta,beta0} 或 null（樣本數不足/IOI無變異）
  const maeVal=computeMAE(lastMatchResult);
  const counts=countTPFPFN(lastMatchResult);
  const fScore=computeFScore(counts);
  sessionLog.push({
    q:questionCount,
    f:parseFloat((fScore*100).toFixed(1)), // F-score：直接用 TP/FA/FN 算（TP_X 已不存在）
    mae:maeVal!==null?Number(maeVal.toFixed(2)):'無法估計', // 算到小數點後兩位； // 這一題所有 TP 自己的 |Error| 取平均
    review:reviewMs,
    myRec:myRecExtraClicks,
    ans:answerExtraClicks,
    n:lastMatchResult.nws.length, // N：這一題樂譜總共有幾個 target event（總拍點/音符數）
    tap:lastMatchResult.hs.length, // TAP：受試者這一題實際打了幾下（不論Hit或多打）
    tp:counts.tp,fa:counts.fa,fn:counts.fn, // 這一題 TP/FA/FN 各自的總數
    rte:rteVal!==null?Number(rteVal.toFixed(1)):'無法估計', // MARTE：依文獻原則，找不到可靠一對一對應區間時明確標記，不留空白避免誤讀成0或缺資料
    beta:betaReg!==null?Number(betaReg.beta.toFixed(2)):'無法估計',
    beta0:betaReg!==null?Number(betaReg.beta0.toFixed(2)):'無法估計',
    aeSum:lastMatchResult.hs.filter(h=>h.result==='Hit').reduce((a,h)=>a+Math.abs(h.diff),0), // 這一題所有TP的AE總和（未四捨五入），只給整體MAE用，不輸出
    imgLink:'' // 圖片連結：前端拿不到真正的網址（見 SUMMARY_HEADER 常數旁邊的說明），這裡先送空字串佔位
  });
  reviewStartTime=null;
  myRecExtraClicks=0;answerExtraClicks=0;
}

/* 整體資料：全部題目合併計算
   F-score：ΣTP、ΣFA、ΣFN 加總後套同一個公式（computeFScore）
   MAE：所有題目全部 TP 的 AE 總和 ÷ 全部 TP 數（一個 TP 都沒有就標「無法估計」） */
function computeOverall(){
  const tot={tp:0,fa:0,fn:0};let aeSum=0;
  sessionLog.forEach(d=>{tot.tp+=d.tp;tot.fa+=d.fa;tot.fn+=d.fn;aeSum+=d.aeSum;});
  return{
    f:parseFloat((computeFScore(tot)*100).toFixed(1)),
    mae:tot.tp>0?Number((aeSum/tot.tp).toFixed(2)):'無法估計'
  };
}
function overallRow(){const o=computeOverall();return[groupId,subjectId,o.f,o.mae];}

}

function uploadToGoogleSheet(){
  if(!GOOGLE_SHEET_WEBHOOK_URL){
    showUploadStatus('尚未設定雲端試算表網址，資料未能上傳，請聯絡研究人員',true);
    return;
  }
  // 對應雲端 Apps Script 的兩張表（順序必須跟 Apps Script 裡 SUMMARY_HEADER / TAP_DETAIL_HEADER 完全一致，
  // 因為 appendRows() 是用 setValues() 依「欄位順序」寫入，不是依欄位名稱比對，見上面常數定義）：
  //   （d.f＝F-score，直接用TP/FA/FN算，見computeFScore()；d.mae＝這一題所有TP自己的|Error|平均，見computeMAE()；
  //    d.n＝這一題總音符數，d.tap＝受試者這一題總拍點數；d.tp/d.fa/d.fn 是這一題 TP/FA/FN 各自的總數
  //    （見 countTPFPFN() 的說明，已經完全沒有 TP_X 這個欄位了，不是保留一個固定0，是整欄不寫）；
  //    d.rte 是這一題整體的 MARTE，d.beta/d.beta0 是這一題整體迴歸的斜率跟截距；
  //    d.imgLink 目前一律是空字串，實際連結要靠 Apps Script 那邊自己補上）
  // 雲端這邊不再送「圖片連結」的空字串佔位，FN 就是最後一欄，Apps Script 寫回的圖片連結會緊接在 FN 後面，不會中間空一欄
  const sessionRows=sessionLog.map(d=>[groupId,subjectId,d.q,d.f,d.mae,d.rte,d.beta,d.beta0,d.n,d.tap,d.tp,d.fa,d.fn]);
  // 分類只有三種：TP=matchAll()判定Hit；FA=matchAll()判定多打；FN=matchAll()判定Miss（沒有TP_X了）。
  // Error/AE 只有 TP 才有值（h.diff：這一拍自己實際跟預期時間點的誤差，及其絕對值）；
  // RTE(%) 有正負號（正偏慢負偏快），ARTE(%) 是它的絕對值，見 logTapDetails()。
  const tapRows=tapDetailLog.map(d=>[groupId,subjectId,d.q,d.idx,d.cat,d.error,d.absError,d.rte,d.arte]);
  fetch(GOOGLE_SHEET_WEBHOOK_URL,{
    method:'POST',
    mode:'no-cors', // Apps Script 的網頁應用程式沒有做 CORS 回應標頭，
                     // 用 no-cors 送出讓瀏覽器不去檢查回應內容，資料仍會確實送達並寫入試算表。
                     // 注意：no-cors 模式下讀不到伺服器實際的成功/失敗狀態碼，
                     // 這裡的「成功」只代表瀏覽器確實把這次請求送出去了（沒有網路層級的錯誤）。
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // 用 text/plain 避免觸發預檢請求（preflight），
                                                            // Apps Script 端仍可用 JSON.parse(e.postData.contents) 正常解析
    body:JSON.stringify({sessionRows,tapRows,overallRows:[overallRow()]}) // overallRows → 雲端「整體資料」工作表
  }).then(()=>{
    showUploadStatus('上傳完畢，資料已送出雲端試算表',false);
  }).catch(err=>{
    console.error('上傳到 Google Sheet 失敗：',err);
    showUploadStatus('上傳失敗，請自行下載CSV檔並交給研究人員',true);
  });
}

/* 專門顯示「資料上傳雲端」進度的區塊，
   讓研究人員能清楚看到「上傳中…」到「上傳完畢」的狀態轉換，不會被其他文字蓋掉或混在一起。 */
function showUploadStatus(text,failed){
  const el=document.getElementById('upload-status');
  el.textContent=text;
  el.style.color=failed?'#e24b4a':'#4caf50';
  el.style.display='block';
}
function finishTest(){
  if(endTmr)clearTimeout(endTmr);if(prepTmr)clearTimeout(prepTmr);
  phase='done';nextReady=false;
  document.querySelector('.score-wrap').style.display='none'; // 結束頁不需要再顯示樂譜、我的錄音／正確答案按鈕
  showMetacog(false);
  document.getElementById('finish-msg').style.display='block';
  document.getElementById('csv-download-row').style.display='block'; // 全部題目都完成了，才讓「下載本機備份 CSV」按鈕出現
  showUploadStatus('資料上傳雲端中…',false);
  uploadToGoogleSheet(); // 資料上傳到雲端試算表；本機 CSV 改為受試者/研究人員自行按按鈕下載，不再自動跳出
}

function reset(){
  userHits=[];lastMatchResult=null;stopMetro();
  clearFb();stopRecording();
  if(endTmr)clearTimeout(endTmr);if(prepTmr)clearTimeout(prepTmr);
  clearPrepCountdown();showPrepCountdown(false); // 換題／重來：把上一題可能還留著的準備倒數收掉，新題目的倒數由接下來的 markQuestionShown() 重新開始
  document.getElementById('next-arrow').style.display='none'; // 換題／重來：黃色箭頭一律先收起來，等這一題兩個音檔都聽完才會再出現
  phase='idle';nextReady=false;
  showPrepRow(false);flashDot(-1);
  showAnswerBtn(false);showMyRecordingBtn(false);
  showMetacog(false); // G2/G3 的提示語在這裡（換到下一題）消失
  audioBusy=false;
  document.getElementById('focus-warning').style.display='none';
}
function newQuestion(){
  autoUploadScoreImage(questionCount+1); // 回饋圖在確定進入下一題時才上傳（要在 exportCSV/reset 之前呼叫，題號與作答資料都還是這一題的）
  exportCSV();
  if(questionCount<SESSION_TOTAL){reset();buildSeq();renderScore();markQuestionShown();}
  else{finishTest();} // 最後一題也要按「點此結束測驗」才會進到結束頁，開始上傳資料、出現下載 CSV 按鈕
}
function retryQ(){reset();renderScore();markQuestionShown();}

/* 左上角 ↺（這一題重新開始）：丟掉這一題目前所有作答(拍點、比對結果、錄音)，停掉預備拍、
   播放中的「正確答案／我的錄音」與所有計時器，回到同一題的20秒準備倒數。
   不會呼叫 exportCSV()／autoUploadScoreImage()，題號不會前進，也不會留下這次的紀錄或回饋圖。 */
function restartCurrentQuestion(){
  // 準備倒數、預備拍、錄製中都可以按：下面 attemptId++／stopPrepAudio()／reset() 會停掉預備拍、錄音、所有計時器
  if(!inTestScreen()){alert('練習尚未開始，沒有可以重新開始的題目。');return;}
  if(document.getElementById('finish-msg').style.display==='block'){alert('練習已經結束，沒有可以重新開始的題目。');return;}
  attemptId++;
  stopPrepAudio();
  stopPlayback();
  retryQ();

/* tX 一定要跟 renderScore() 畫音符時用的座標公式完全一致，回饋點才會真的對齊在音符正下方。
   renderScore 是「每個小節自己一份座標」：每個小節有自己的起點（含左右內縮 IP），小節內再切成 4 等份
   （每一拍一份）。原本 tX 是用整首曲子的時間比例去換算位置，沒有考慮到每個小節自己的內縮邊界，
   算出來的位置會跟真正畫出來的音符位置有系統性的落差（而且每個小節都會重複發生一次），
   所以才會看起來「視覺回饋跟樂譜對不齊」。這裡改成跟 renderScore 用同一套「小節→拍」公式反推。 */
function tX(t){
  const totalB=BARS*4;
  // 先把拍數四捨五入到百萬分之一拍，消除浮點誤差：例如 65 BPM 時 12*BEAT/BEAT 會算成 11.999999999999998，
  // 下面 Math.floor(bGlobal/4) 就會把第四小節第一拍誤判成第三小節，回饋點被畫到小節線左邊。
  // 1e-6 拍在畫面上遠小於 1px，不影響一般拍擊時間的定位；tX() 只負責畫面座標，不影響任何判定或計分。
  const raw=Math.round((t/BEAT)*1e6)/1e6;
  const bGlobal=Math.min(Math.max(raw,0),totalB);
  const bi=Math.min(Math.max(Math.floor(bGlobal/4),0),BARS-1);
  const bLocal=Math.min(Math.max(bGlobal-bi*4,0),4);
  const sl=LAYOUT.L+bi*LAYOUT.SW,il=sl+LAYOUT.IP,iw=LAYOUT.SW-LAYOUT.IP*2,bw=iw/4;
  const x=il+bLocal*bw+bw/2;

}

   注意第一個事件沒有「前一個事件」，buildRanges() 會用「虛擬前一拍（b-1）」算出一個負的時間當作 L，
   讓 tX() 內部自己的 0 下限直接把它夾成跟這個事件的 idealT 同一個位置，這時候如果再疊加 +6 的安全間距，
   反而會把左邊界推到比錨點本身還右邊，導致第一個音符的回饋點永遠被夾線往右頂。

function winBounds(win){
  const lo=win.L>1e-9?tX(win.L)+6:LAYOUT.L;

/* 回饋位置的核心原則：以「這個判定窗自己代表的音符/休止符理想時間」為錨點（tX(win.idealT)，
   也就是符號本身畫出來的位置）。
   - 判為「準」（|diffMs|<=60ms，需與 logTapDetails() 的「準」門檻保持一致）：直接對齊錨點正下方，不做左右偏移。
   - 其餘（快/慢）：以錨點為基準，依時間誤差做小幅左右微調（早的偏左、晚的偏右），
     而不是直接用原始拍擊時間去換算座標。
   原因：判定窗的寬度是用「跟前後音符的中點」切出來的，遇到前面接著休止符、或前一個音符時值較長時，
   窗本身可能很寬——如果直接用原始拍擊時間換算位置，落在窗的邊緣附近時，畫出來的點會離它真正
   對應的音符符號很遠，看起來就會像「上面根本沒有對應的符號」一樣，容易誤導。用錨點＋小幅偏移，
   才能保證不管窗多寬，回饋點永遠緊貼在它所屬的那個音符/休止符正下方一小段範圍內，同時仍然保留
   「早出現在左、晚出現在右」的方向性；最後再用窗自己的 [L,R] 邊界做一次保險夾線，

function eventX(t,win){
  if(!win)return tX(t); // 極少數完全落在所有判定窗之外的邊界情況，沒有錨點可用，退回原始時間位置
  const anchor=tX(win.idealT);
  const diffMs=(t-win.idealT)*1000;
  const[lo,hi]=winBounds(win);
  if(Math.abs(diffMs)<=60)return(hi>lo)?Math.min(Math.max(anchor,lo),hi):anchor; // 準：對齊音符正下方，不偏移
  const cap=Math.min(24,LAYOUT.SW/4*0.35); // 局部微調的最大位移量
  const norm=Math.max(-1,Math.min(1,diffMs/300));
  let x=anchor+norm*cap;
  if(hi>lo)x=Math.min(Math.max(x,lo),hi);

}
function renderFb(){
  fbIds.forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});
  fbIds=[];
  const sorted=[...fbEvents].sort((a,b)=>a.ord-b.ord||a.t-b.t);
  let prevOrd=null,prevX=-Infinity;
  sorted.forEach(e=>{
    // 綠點（判準，eventX() 已經幫它算出貼齊音符正下方的座標）一律固定在這個位置，
    // 不套用同窗防疊間距的推擠——不然如果同一個窗裡剛好還有別的拍點（例如附近一次多打），
    // 綠點就可能被擠離音符正下方，變成看起來「打準了但點沒對齊」。真的跟別的點疊在一起，
    // 犧牲的是防疊間距，不是綠點該有的位置。
    const isGreen=e.kind==='dot'&&e.col==='#4caf50';
    let cx=e.x;
    if(!isGreen){
      if(e.ord===prevOrd)cx=Math.max(cx,prevX+DOT_GAP); // 只跟「同一個窗」裡上一顆比，換到新窗就重新開始
      if(e.win){
        const[lo,hi]=winBounds(e.win); // 保險夾線，絕不超出這個窗自己的邊界
        if(hi>lo)cx=Math.min(Math.max(cx,lo),hi);
      }
    }
    prevX=cx;prevOrd=e.ord;
    if(e.kind==='dot')drawDot(cx,e.col,e.t);
    else if(e.kind==='x')drawX(cx,e.t);
    else drawEmptyCircle(cx);
  });
}

/* ---- IOI（樂譜上 target events 之間的理想間距）與 ITI（受試者實際拍點之間的間距）----
   IOI：只計算「target events」（四分音符、八分音符）之間的間距；休止符本身不產生 target event，
   但休止符的時值仍然會計入前後兩個 target events 之間的距離——這已經自然反映在 idealT 裡，
   因為 idealT 是用整首曲子的拍位置 b*BEAT 算出來的，休止符照樣會佔掉自己的拍位置，
   所以「連續兩個 target events 的 idealT 相減」跟文件裡「音符時值+休止符時值 → IOI」的算法是一致的。
   ITI：單純是受試者兩次實際拍擊 timestamp（userHits，單位：秒，相對 taskStartTime）的時間差，
   不判斷音符或休止符，也不管有沒有配對成功（Hit / FA 都算在內）。 */
function computeIOISeq(){
  const evts=buildRanges(globalSeq(),BEAT);
  const notes=evts.filter(e=>!e.r); // 只留 target events（四分音符、八分音符），休止符不算
  // 第一個 target event 前面沒有「上一個 target event」，這裡把樂曲開頭（0ms）當成虛擬的第 0 個事件，
  // 所以第一個 target event 的 IOI 就是「從 0ms 到它自己的 onset」，不再留空。
  return notes.map((n,i)=>({idealT:n.idealT,ioi:i===0?Math.round(n.idealT*1000):Math.round((n.idealT-notes[i-1].idealT)*1000)}));
}

   RTE = (1/N) * Σ |ITI_i - IOI_i| / IOI_i × 100%
   N 是 matchAll() 判定為 Hit 且 IOI 不為 0 的拍點數；h.iti/h.ioi 是 matchAll() 判定當下直接
   算出來的（如果前面連續判過幾個 Miss，這裡的 IOI 就是好幾個音符的 IOI 累加起來）。
   當這一題完全沒有這樣的 Hit（例如整題都 Miss/多打，或唯一的 Hit 剛好落在 IOI=0 的邊界情況），
   代表沒辦法估計時間結構，回傳 null，由呼叫端（updateRTESummary／CSV）標記為「無法估計」，
   而不是硬湊出一個數字。 */
function computeOverallRTE(r){
  if(!r||!r.hs||r.hs.length===0)return null;
  const errs=[];
  r.hs.forEach(h=>{if(h.result==='Hit'&&h.ioi)errs.push(Math.abs(h.iti-h.ioi)/h.ioi);});

  return errs.reduce((a,b)=>a+b,0)/errs.length*100;

  const t1=E('text',{x:NL-16,y:LY-3,fill:'#111','font-size':'13','font-weight':'bold','font-family':'serif','text-anchor':'middle'});t1.textContent='4';svg.appendChild(t1);
  const t2=E('text',{x:NL-16,y:LY+13,fill:'#111','font-size':'13','font-weight':'bold','font-family':'serif','text-anchor':'middle'});t2.textContent='4';svg.appendChild(t2);
  curBars.forEach((bar,bi)=>{
    const sl=NL+bi*SW_,il=sl+IP,iw=SW_-IP*2;
    function nx(b){const bw=iw/4;return il+b*bw+bw/2;}
    let i=0;
    while(i<bar.length){
      const n=bar[i],cx=nx(n.b);
      if(n.d===1&&!n.r){svg.appendChild(E('ellipse',{cx,cy:LY,rx:'7',ry:'5',fill:'#111',transform:`rotate(-15,${cx},${LY})`}));svg.appendChild(E('line',{x1:cx+6,y1:LY-2,x2:cx+6,y2:ST,stroke:'#111','stroke-width':'1.8','stroke-linecap':'round'}));i++;}
      else if(n.d===1&&n.r){const t=E('text',{x:cx,y:LY,'font-family':'"NotoMusic",serif','font-size':'38',fill:'#111','text-anchor':'middle','dominant-baseline':'middle'});t.textContent='\uD834\uDD3D';svg.appendChild(t);i++;}
      else if(n.d===0.5&&n.r){const t=E('text',{x:cx,y:LY+8,'font-family':'"NotoMusic",serif','font-size':'38',fill:'#111','text-anchor':'middle','dominant-baseline':'middle'});t.textContent='\uD834\uDD3E';svg.appendChild(t);i++;}
      else if(n.d===0.5&&!n.r){
        const beatOf=Math.floor(n.b);let j=i+1;while(j<bar.length&&bar[j].d===0.5&&!bar[j].r&&Math.floor(bar[j].b)===beatOf)j++;
        const grp=bar.slice(i,j),sxs=[];
        grp.forEach(gn=>{const gcx=nx(gn.b),sx=gcx+6;svg.appendChild(E('ellipse',{cx:gcx,cy:LY,rx:'7',ry:'5',fill:'#111',transform:`rotate(-15,${gcx},${LY})`}));svg.appendChild(E('line',{x1:sx,y1:LY-2,x2:sx,y2:ST,stroke:'#111','stroke-width':'1.8','stroke-linecap':'round'}));sxs.push(sx);});
        if(grp.length===1){svg.appendChild(E('path',{d:`M${sxs[0]},${ST} C${sxs[0]+14},${ST+8} ${sxs[0]+12},${ST+18} ${sxs[0]+4},${ST+22}`,fill:'none',stroke:'#111','stroke-width':'2','stroke-linecap':'round'}));}
        else{svg.appendChild(E('line',{x1:sxs[0],y1:ST,x2:sxs[sxs.length-1],y2:ST,stroke:'#111','stroke-width':'5','stroke-linecap':'butt'}));}
        i=j;
      }else i++;
    }
  });
  line(NL,LY,NR,LY,'1.8');
  line(NL,LY-22,NL,LY+22,'1.5');
  for(let b=1;b<BARS;b++){const bx=NL+b*SW_;line(bx,LY-22,bx,LY+22,'1.2');}
  line(NR+2,LY-22,NR+2,LY+22,'1.5');
  line(NR+8,LY-22,NR+8,LY+22,'5');
}

// 頁面載入時套用 DEFAULT_QUESTION_SET（練習階段6題.json），，固定按題組出題。
try{
  const preset=parseCustomFile(DEFAULT_QUESTION_SET);
  customQuestions=preset;
  SESSION_TOTAL=preset.length;
}catch(e){console.error('預設題組載入失敗',e);alert('題組載入失敗，請聯絡研究人員：\n'+e.message);}

buildSeq();renderScore();
document.fonts.load('38px NotoMusic').then(()=>renderScore()).catch(()=>{});
</script>
